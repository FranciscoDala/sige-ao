services:
    - type: web
    name: sige-ao-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    region: frankfurt
    plan: free
    autoDeploy: true
    envVars:
            - key: DATABASE_URL
        fromDatabase:
            name: sigeao-db
            property: connectionString

databases:
    - name: sigeao-db
    databaseName: sigeao_db
    user: sigeao_user
    region: frankfurt
    plan: free
